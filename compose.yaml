# Environnement de développement : MySQL 8 (comme en production) + Mailpit pour lire les e-mails.
#   docker compose up -d
#   DATABASE_URL="mysql://genwod:genwod@127.0.0.1:3306/genwod?serverVersion=8.0.32&charset=utf8mb4"
#   Interface Mailpit : http://localhost:8025
services:
  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: genwod
      MYSQL_USER: genwod
      MYSQL_PASSWORD: genwod
      MYSQL_ROOT_PASSWORD: genwod-root
    ports:
      - "3306:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugenwod", "-pgenwod"]
      interval: 5s
      retries: 10

  mailer:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  database_data:
