name: CI

on:
  push:
    branches: [main, refonte/v2]
  pull_request:

jobs:
  qualite:
    name: Tests & analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Dépendances Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style de code (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Préparation du conteneur Symfony
        run: php bin/console cache:warmup --env=dev

      - name: Analyse statique (PHPStan niveau 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        env:
          DATABASE_URL: sqlite:///%kernel.project_dir%/var/phpstan.db

      - name: Linters Symfony
        run: |
          php bin/console lint:twig templates
          php bin/console lint:yaml config
          php bin/console lint:container
          php bin/console doctrine:schema:validate --skip-sync

      - name: Tests (PHPUnit)
        run: php bin/phpunit

  # Mise en production sur Hostinger, uniquement si les tests passent.
  # Sans les secrets HOSTINGER_* (Settings → Secrets and variables → Actions), l'étape est ignorée.
  deploiement:
    name: Déploiement Hostinger
    needs: qualite
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', vars.BRANCHE_DEPLOIEMENT || 'refonte/v2')
    runs-on: ubuntu-latest
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
      - name: Mise en production
        env:
          HOTE: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          UTILISATEUR: ${{ secrets.HOSTINGER_USER }}
          CLE: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOTES_CONNUS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          DOSSIER: ${{ secrets.HOSTINGER_PATH }}
        run: |
          if [ -z "$HOTE" ] || [ -z "$UTILISATEUR" ] || [ -z "$CLE" ] || [ -z "$DOSSIER" ]; then
            echo "::notice::Secrets HOSTINGER_* absents : déploiement ignoré."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          if [ -n "$HOTES_CONNUS" ]; then
            printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-65002}" "$HOTE" > ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/deploiement -p "${PORT:-65002}" -o BatchMode=yes "$UTILISATEUR@$HOTE" \
            "bash '$DOSSIER/bin/deploiement-distant' $GITHUB_SHA"
