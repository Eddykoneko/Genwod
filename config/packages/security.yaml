security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_tableau_de_bord
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_accueil
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                path: /
                signature_properties: ['password']
            # 5 tentatives par minute et par IP+identifiant (symfony/rate-limiter)
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/mon-espace, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
